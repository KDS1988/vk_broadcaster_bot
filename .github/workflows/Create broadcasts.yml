name: Create VK broadcasts for a date

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Дата матчей в формате ДД.ММ.ГГГГ (как в колонке "Дата" листа Calendar)'
        required: true
        type: string
  # Необязательно: автозапуск по расписанию на "завтра". Раскомментируй,
  # если хочешь, чтобы это происходило само по себе, а не только по кнопке.
  # schedule:
  #   - cron: '0 18 * * 5'  # пятница 18:00 UTC — под своё время подставь

jobs:
  create-broadcasts:
    # self-hosted, не ubuntu-latest — иначе каждый прогон новый IP, и VK
    # будет чаще просить подтверждение входа
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      # actions/setup-python убран: на self-hosted раннере он пытается
      # создать кэш инструментов по пути /Users/runner/... (захардкожен
      # для облачных macOS-раннеров) и падает с Permission denied, т.к.
      # реальный пользователь другой.
      #
      # Используем venv в ~/vk-bot/venv (вне рабочей папки репозитория,
      # чтобы actions/checkout его не стирал при следующем чекауте) —
      # системный Homebrew Python на macOS блокирует pip install напрямую
      # (PEP 668 externally-managed-environment), venv это обходит.
      # Один раз перед первым запуском на самой машине:
      #   python3 -m venv ~/vk-bot/venv
      #   source ~/vk-bot/venv/bin/activate
      #   pip install -r requirements.txt && playwright install chromium

      - name: Install dependencies
        run: |
          /Users/dkorneev/vk-bot/venv/bin/pip install -r requirements.txt
          /Users/dkorneev/vk-bot/venv/bin/python -m playwright install chromium

      - name: Decode Google service account key
        run: echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}" | base64 -d > service_account.json

      - name: Run bot
        env:
          VK_STATE_PATH: /Users/dkorneev/vk-bot/vk_storage_state.json
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          WORKSHEET_NAME: Calendar
          # workflow_dispatch.inputs.date — та самая "кнопка": на какую
          # дату жмёшь "Run workflow", те матчи и создаются
          TARGET_DATE: ${{ inputs.date }}
        run: /Users/dkorneev/vk-bot/venv/bin/python vk_broadcast_bot.py

      - name: Clean up secrets from workspace
        if: always()
        run: rm -f service_account.json
